<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Banananade Stand</title>
    <link rel="stylesheet" href="../styles/exercise20.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script defer src="../scripts/exercise21_.js"></script>
    
 </head>
	
	<body>
		<h1>The World's BEST Banananade!</h1>
		<article>
			<h2>Add Ingredients</h2>
			<label for='tbBananas'>
				<img src="../images/plus_light.png" >
				<span class="clickable">Add Bananas</span>
				<input class="hide_me" id="tbBananas"></input>
			</label>
			<label for='tbWaters'>
				<img src="../images/plus_light.png" >
				<span class="clickable">Add Gallons of Water</span>
				<input class="hide_me" id="tbWaters"></input>
			</label>
			<label for='tbSugars'>
				<img src="../images/plus_light.png" >
				<span class="clickable">Add Cups of Sugar</span>
				<input class="hide_me" id="tbSugars"></input>
			</label>
			<label for='tbGlasses'>
				<img src="../images/plus_light.png" >
				<span class="clickable">Add Empty Glasses</span>
				<input class="hide_me" id="tbGlasses"></input>
			</label>
		</article>
		<article>
            <h2>Controls</h2>
            <button class="makebtn">Make Bananaade</button>
            <button class="sellbtn">Sell Bananaade</button>
            
            <label for="priceInput">Set Price: $</label>
            <input type="number" id="priceInput" value="2.00">
            <button class="pricebtn">Update Price</button>
            
            <label for="sellMoreInput">Sell Multiple (0-8):</label>
            <input type="number" id="sellMoreInput" min="0" max="8" value="1">
            <button class="sellmorebtn">Sell Multiple</button>
		</article>
  </body>
</html>
