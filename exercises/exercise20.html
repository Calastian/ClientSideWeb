<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Banananade Stand</title>
    <link rel="stylesheet" href="../styles/exercise20.css">
    <script defer src="../scripts/exercise20.js"></script>
 </head>
	
	<body>
		<h1>The World's BEST Banananade!</h1>
		<article>
			<h2>Add Ingredients</h2>
			<label for='tbBananas'>
				<img src="../images/plus_light.png" >
				<span class="clickable">Add Bananas</span>
				<input class="hide_me" id="tbBananas"></input>
			</label>
			<label for='tbWaters'>
				<img src="../images/plus_light.png" >
				<span class="clickable">Add Gallons of Water</span>
				<input class="hide_me" id="tbWaters"></input>
			</label>
			<label for='tbSugars'>
				<img src="../images/plus_light.png" >
				<span class="clickable">Add Cups of Sugar</span>
				<input class="hide_me" id="tbSugars"></input>
			</label>
			<label for='tbGlasses'>
				<img src="../images/plus_light.png" >
				<span class="clickable">Add Empty Glasses</span>
				<input class="hide_me" id="tbGlasses"></input>
			</label>
		</article>
		<article>
            <h2>Controls</h2>
            <button>Make Bananaade</button>
            <button>Sell Bananaade</button>
                
		</article>
  </body>
</html>
